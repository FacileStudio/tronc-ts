name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: vectors match the recorded Go tronc tag
        run: |
          sh scripts/sync-vectors.sh "$(cat testdata/vectors/SOURCE)"
          git status --porcelain testdata/vectors
          test -z "$(git status --porcelain testdata/vectors)"

  filet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FacileStudio/filet@v0.19.3
        with:
          version: v0.19.3
          fail-on: error
